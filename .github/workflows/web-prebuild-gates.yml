# The gates the production build runs, run BEFORE the merge instead of after it.
#
# WHY THIS EXISTS. `scripts/vercel-ignored-build.sh` proceeds only for protected
# refs, so a preview deployment never runs `npm run build` and therefore never
# runs `prebuild`. Every gate in that chain — the declared route-capability
# table, the service-client principal census, the unauthenticated side-effect
# census — was real but unreachable until the merge had already happened. Twice
# a lane merged a green PR and broke staging for everyone: Communications with
# app/api/communications/unsubscribe on 2026-08-20, Attendance with
# app/api/admin/childcare-attendance/service-day-exception on 2026-09-09. Both
# times the gate worked perfectly and simply ran too late to be of use.
#
# IT RUNS `npm run prebuild`, NOT A COPY OF IT. A second implementation of the
# route-capability check is the failure this repair must not introduce: it would
# drift from the one the build runs, and then a PR could pass here and still
# break the build. Invoking the identical script keeps pre-merge and build
# validation the same thing by construction, so the ratchet, the manifest and
# every refusal behave identically in both places.
#
# It does not replace or weaken the protected-ref build, which still runs this
# same chain before `next build`. This is an earlier copy of that verdict, not a
# substitute for it.
#
# NO `paths:` FILTER, DELIBERATELY. This is a REQUIRED status check, and GitHub
# holds a pull request at "Expected — waiting for status to be reported" when a
# required check never reports. A path-filtered required check therefore blocks
# every pull request that does not touch those paths, permanently: docs-only
# changes, certification/ work, and every scripts/local-dev toolkit promotion.
# Vacilando cannot even explain the stall — `summarizeCheckRollup` classifies
# only checks that actually reported, so a never-reported required check counts
# 2 of 3 and appears in neither `failing` nor `pending`.
#
# The two required checks that came before this one, `Trust Adoption
# certification` and `Trust DB certification`, both use a bare
# `on: pull_request` for exactly this reason. This follows them. Running the
# chain on every pull request costs about a minute; Trust DB provisions a
# Postgres on every pull request, so the proportion is already settled.
name: Web prebuild gates
on:
  pull_request:

defaults:
  run:
    working-directory: web

jobs:
  prebuild-gates:
    name: Prebuild gates (route capabilities)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: "web/.nvmrc"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # The exact chain `npm run build` runs first. A new route missing from
      # scripts/routeCapabilities.declared.json fails here, on the PR, instead
      # of on staging after the merge.
      - run: npm run prebuild
      # THE GOVERNED-ACTION CONTRACT, WHICH NOTHING RAN.
      #
      # GC2, GC4 and GC5 assert that every registered action has a governed mode,
      # a fulfil dispatch branch and an executor branch. They were correct and
      # they were red: `environment.execute_registered_reconciliation` sat
      # registered, approvable and unreachable on staging, and no workflow ran
      # the suite that said so, so nothing reported it.
      #
      # Scoped to this one file on purpose. Other suites under
      # scripts/local-dev/tests have pre-existing failures unrelated to the action
      # contract, and making a REQUIRED check depend on all of them would block
      # every pull request in the fleet to fix one class of defect.
      #
      # No npm dependencies: these are plain `node --test` modules that import
      # from scripts/local-dev/lib directly, which is why this runs from the
      # repository root rather than `web`.
      - name: Governed action contract (registered ⇒ mode + dispatch + executor)
        working-directory: .
        run: node --test scripts/local-dev/tests/development-governed-action-contract.test.mjs
