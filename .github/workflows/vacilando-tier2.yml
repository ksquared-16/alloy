# TIER 2 — EXTENDED DETERMINISTIC VACILANDO INVENTORY
#
# Visibility, not blocking. Tier 1 (the required prebuild gates) covers 17 files
# and is green; the other ~285 Vacilando-owned tests had no CI at all, which is
# how a red survived two promotions unnoticed and how 22 tests came to rely on
# default auto-dispatch.
#
# This runs the DETERMINISTIC subset only, and never blocks a PR:
#   excluded — Tier 3 host integration: anything that shells to tmux without
#              runtime-root isolation. A generic runner has no tmux and no lanes,
#              so these would fail for the environment rather than for the code.
#   excluded — Tier 4 certification/live: deployed-*, qa-*, production-apply-*,
#              migration-*, certification-*. Explicit environment and mission only.
#
# The exclusions are COMPUTED, not listed, so a new test lands in the right tier
# by construction instead of by somebody remembering to edit a list here.
name: Vacilando Tier 2 (extended, non-blocking)

# ── RETIRED. VACILANDO OWNS ITS OWN CI. ──────────────────────────────────────
#
# S5's certification clause was that Vacilando's CI belongs to Vacilando, and
# that is now true and measured: ksquared-16/vacilando runs tier1 (239
# blocking), tier2 (extended) and release on every push, and the runtime this
# machine executes was BUILT by that release workflow — toolkit/current resolves
# to a generation-2 artifact whose manifest names ksquared-16/vacilando as its
# producer.
#
# Alloy's copy is therefore a second owner of one question, and a second owner
# is a source of drift rather than of confidence.
#
# THE NIGHTLY SCHEDULE IS REMOVED, which is what retires it: `on: schedule` was
# the only trigger that fired by itself, and GitHub runs scheduled workflows
# only from the default branch — this one. `workflow_dispatch` is kept so the
# inventory stays reachable by hand while Vacilando's own Tier 2 is the record.
#
# The file is neutralised rather than deleted because the governed
# repository-metadata class copies declared files into `main`; it has no way to
# express a deletion, and removing it any other way would cost an Alloy source
# promotion that this slice is not permitted to spend.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      tested_ref:
        description: "Branch or SHA to test (defaults to staging, the development trunk)"
        required: false
        default: "staging"

permissions:
  contents: read

jobs:
  extended:
    name: Extended deterministic inventory
    runs-on: ubuntu-latest
    # Belt and braces: even though every dispatch-capable test now declares
    # itself, the runner must never be able to start real work.
    env:
      VACILANDO_AUTO_DISPATCH: "0"
    timeout-minutes: 60
    steps:
      # THE DEFINITION LIVES ON main; THE CODE UNDER TEST LIVES ON staging.
      #
      # GitHub resolves a scheduled workflow from the DEFAULT branch, and a bare
      # checkout would then check out main - where scripts/local-dev/tests does
      # not exist at all (0 files on main, 376 on staging). This workflow would
      # have failed on `cd scripts/local-dev/tests` on every scheduled run, which
      # is worse than not running: a permanently red nightly teaches people to
      # ignore it.
      #
      # main is Alloy's release branch and is expected to lag staging during
      # pre-production development. That is branch doctrine, not staleness debt.
      # So the ref is named explicitly rather than inherited.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tested_ref || 'staging' }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Record what defined this run and what it is testing
        id: provenance
        run: |
          # Two different SHAs, and conflating them is the whole hazard.
          echo "workflow_definition_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "tested_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tested_ref=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo detached)" >> "$GITHUB_OUTPUT"
          {
            echo "## Provenance"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| workflow definition (default branch) | \`${GITHUB_REF_NAME}\` @ \`${GITHUB_SHA}\` |"
            echo "| code under test | \`$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo detached)\` @ \`$(git rev-parse HEAD)\` |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Refuse to run against a tree without the inventory
        run: |
          # Fail loudly rather than silently testing the wrong branch.
          if [ ! -d scripts/local-dev/tests ]; then
            echo "::error::checked-out tree has no scripts/local-dev/tests - this is not the development trunk"
            exit 1
          fi
          echo "inventory present: $(ls scripts/local-dev/tests/*.test.mjs | wc -l) files"

      - name: Partition the inventory
        id: partition
        run: |
          cd scripts/local-dev/tests
          : > /tmp/tier3 ; : > /tmp/tier4 ; : > /tmp/tier2
          for f in *.test.mjs; do
            case "$f" in
              deployed-*|qa-*|production-apply-*|migration-*|certification-*)
                echo "$f" >> /tmp/tier4 ; continue ;;
            esac
            tmux_refs=$(grep -c "tmux" "$f" || true)
            isolation=$(grep -cE "ALLOY_RUNTIME_ROOT|mkdtemp" "$f" || true)
            if [ "${tmux_refs:-0}" -gt 0 ] && [ "${isolation:-0}" -eq 0 ]; then
              echo "$f" >> /tmp/tier3
            else
              echo "$f" >> /tmp/tier2
            fi
          done
          echo "tier2=$(wc -l < /tmp/tier2)" >> "$GITHUB_OUTPUT"
          echo "tier3=$(wc -l < /tmp/tier3)" >> "$GITHUB_OUTPUT"
          echo "tier4=$(wc -l < /tmp/tier4)" >> "$GITHUB_OUTPUT"

      - name: Run Tier 2
        id: tier2
        env:
          TIER2_TESTED_SHA: ${{ steps.provenance.outputs.tested_sha }}
          TIER2_TESTED_REF: ${{ steps.provenance.outputs.tested_ref }}
          TIER2_DEFINITION_SHA: ${{ github.sha }}
          TIER2_DEFINITION_REF: ${{ github.ref_name }}
          TIER2_EXCLUDED_TIER3: ${{ steps.partition.outputs.tier3 }}
          TIER2_EXCLUDED_TIER4: ${{ steps.partition.outputs.tier4 }}
        run: |
          # ONE RESULT, RENDERED TWICE. The counting lives in
          # scripts/local-dev/lib/vacilando/tier2-report.mjs so the step summary
          # and the JSON artifact cannot disagree - the previous inline loop
          # wrote its red ledger only to GITHUB_STEP_SUMMARY, which the logs API
          # does not return, so no tool could name the failing files.
          node scripts/local-dev/tier2-run.mjs /tmp/tier2 "$PWD/scripts/local-dev/tests" tier2-result.json
          # NON-BLOCKING BY DESIGN. Known reds exist and are classified; failing
          # this job would only train people to ignore it. It is promoted to
          # blocking per-file, by moving a file into Tier 1, as each goes green.
          exit 0

      # Retrievable through the API without scraping rendered markdown.
      - name: Publish the machine-readable result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier2-result
          path: tier2-result.json
          if-no-files-found: error
