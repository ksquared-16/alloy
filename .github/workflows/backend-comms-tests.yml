# Communications C1 Python tests — consent, eligibility and outbound policy in the dispatcher.
# Deterministic: every network call is faked; no Supabase, Twilio or Resend credentials are read.
# Only the declared runtime dependencies (backend/requirements.txt) are installed; tests use stdlib unittest.
name: Backend communications tests
on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-comms-tests.yml"
  # POST-MERGE VERIFICATION: unfiltered on staging, as web-typecheck — a verifier waiting for this check
  # on a merged SHA must never wait for a run a path filter suppressed.
  push:
    branches: [staging]

concurrency:
  group: backend-comms-tests-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: backend

jobs:
  c1-python:
    name: C1 Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: "backend/.python-version"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      # C1 set: SMS STOP/START keywords, unsubscribe headers on outbound email, keyword replies not sent,
      # dispatch eligibility (consent / suppression / quiet hours), and the legacy SMS dispatcher's
      # policy gate. TestBuildInfo is excluded: it needs httpx, which the backend does not declare.
      - name: Run C1 tests
        env:
          SUPABASE_URL: ""
          SUPABASE_SERVICE_ROLE_KEY: ""
        run: >-
          python -m unittest -v
          tests.test_inbound_sms_keywords
          tests.test_email_thread_headers
          tests.test_keyword_response_not_sent
          tests.test_dispatch_eligibility
          tests.test_message_sender_qa_refuse.TestMessageSenderQaRefuse
