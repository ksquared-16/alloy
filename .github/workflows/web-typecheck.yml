# Catches TypeScript drift before merge.
# Production graph (app + API) on every PR; full test graph in a separate required job.
name: Web typecheck
on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-typecheck.yml"
  # POST-MERGE VERIFICATION (Vacilando G3-B S6). Every revision merged to
  # staging is typechecked ON ITS OWN SHA, so "merged" and "verified" are
  # different facts and a staging revision that does not compile is seen at the
  # merge, not hours later. Unfiltered on purpose: a verifier waiting for these
  # check names on a merged SHA must never wait for a run a filter suppressed.
  push:
    branches: [staging]

# One group per event and SHA: a newer staging push never cancels (or replaces
# the pending run of) an older merged revision's verification.
concurrency:
  group: web-typecheck-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: web

jobs:
  typecheck:
    name: Production graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: "web/.nvmrc"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  typecheck-tests:
    name: Full graph (tests + scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: "web/.nvmrc"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck:tests
