# Catches TypeScript drift before merge.
# Production graph (app + API) on every PR; full test graph in a separate required job.
name: Web typecheck
on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-typecheck.yml"

defaults:
  run:
    working-directory: web

jobs:
  typecheck:
    name: Production graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: "web/.nvmrc"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  typecheck-tests:
    name: Full graph (tests + scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: "web/.nvmrc"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck:tests
