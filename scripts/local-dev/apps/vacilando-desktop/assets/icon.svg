<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#163b28"/>
      <stop offset="0.52" stop-color="#8f5334"/>
      <stop offset="1" stop-color="#cc7d4b"/>
    </linearGradient>
    <linearGradient id="dune1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c46c40"/>
      <stop offset="1" stop-color="#a4512d"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd9a3"/>
      <stop offset="0.6" stop-color="#f2bd83"/>
      <stop offset="1" stop-color="#eab07a"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f3c48c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f3c48c" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="squircle">
      <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <!-- sky -->
    <rect width="1024" height="1024" fill="url(#sky)"/>
    <!-- sun + halo -->
    <circle cx="670" cy="392" r="260" fill="url(#halo)"/>
    <circle cx="670" cy="392" r="132" fill="url(#sun)"/>
    <!-- distant dune -->
    <path d="M0 690 Q280 590 540 668 T1024 636 V1024 H0 Z" fill="url(#dune1)"/>
    <!-- near dune -->
    <path d="M0 812 Q320 712 620 792 T1024 772 V1024 H0 Z" fill="#8a4527"/>
    <!-- agave rosette -->
    <g fill="#14311f" transform="translate(300 690)">
      <path d="M0 150 L-14 12 L14 12 Z"/>
      <path d="M0 150 C-30 70 -84 40 -120 44 C-78 22 -30 44 0 118 Z"/>
      <path d="M0 150 C30 70 84 40 120 44 C78 22 30 44 0 118 Z"/>
      <path d="M0 150 C-24 60 -60 -6 -70 -74 C-40 -24 -14 40 0 122 Z"/>
      <path d="M0 150 C24 60 60 -6 70 -74 C40 -24 14 40 0 122 Z"/>
      <path d="M0 150 C-8 60 -20 -30 -20 -104 C-4 -40 -2 44 0 126 Z"/>
      <path d="M0 150 C8 60 20 -30 20 -104 C4 -40 2 44 0 126 Z"/>
    </g>
  </g>
</svg>
