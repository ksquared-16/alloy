<div class="frame">

    <button class="sw" role="tab" aria-selected="true" data-s="overview">Overview</button>
    <button class="sw" role="tab" aria-selected="false" data-s="place">Place a child</button>
    <button class="sw" role="tab" aria-selected="false" data-s="resolve">Over ratio</button>
    <button class="sw" role="tab" aria-selected="false" data-s="roster">Roster</button>
  </div>

  <div class="app">
    <nav class="rail" aria-hidden="true"><div class="rl0">A</div><div class="ri">◫</div><div class="ri">◷</div><div class="ri on">▦</div><div class="ri">✉</div><div class="ri">◧</div><div class="ri">▤</div></nav>
    <div class="main">
      <div class="topbar"></div>
      <div class="shell">
        <div class="cband">
          <div class="whead"><div class="wid"><span class="wico">▦</span><div><div class="wt">Scheduling</div><div class="ws2" id="sub">Maple Street · week of Jul 20</div></div></div>
            <div class="wacts"><button class="bs">This week ▾</button><button class="bp" id="act">Resolve</button><button class="bx">✕ Close</button></div></div>
          <div class="mnav"><div class="msplit"><div class="subtabs" id="subtabs"></div><div class="oph" id="oph"></div></div></div>
        </div>
        <div class="inset"><div class="canvas" id="canvas">
          <section class="screen on" id="s-overview"></section>
          <section class="screen" id="s-place"></section>
          <section class="screen" id="s-resolve"></section>
          <section class="screen" id="s-roster"></section>
        </div></div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){

    place:[["Overview",1],["Roster",0],["Attendance",0]],
    resolve:[["Overview",1],["Roster",0],["Attendance",0]],
    roster:[["Overview",0],["Roster",1],["Attendance",0]]
