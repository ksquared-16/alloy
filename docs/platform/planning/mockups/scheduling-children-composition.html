<title>Children &amp; Scheduling — Focus Panel</title>
<style>
  :root{
    --pine:#00A283;--pine-hover:#009276;--forge:#273F52;--ink:#18273A;--slate:#4b5563;--muted:#59678b;
    --stone:#F4F6F9;--gold:#DBC078;--gold-dark:#d0ad50;--ember:#BC4300;--blue:#00458C;--page:#EEF2F8;--border:#e5e9ef;
    --font:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    --mid-45:rgba(39,63,82,.45);--mid-40:rgba(39,63,82,.40);--mid-35:rgba(39,63,82,.35);--mid-25:rgba(39,63,82,.25);--mid-70:rgba(39,63,82,.70);
    color-scheme:light;
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{background:var(--page);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;font-size:13px;line-height:1.45}
  .tab{font-variant-numeric:tabular-nums} h1,h2,h3{margin:0} button{font-family:inherit;cursor:pointer;border:none;background:none}
  .frame{max-width:520px;margin:0 auto;padding:22px 18px 48px}
  .switch{display:flex;gap:6px;margin-bottom:14px;justify-content:center;flex-wrap:wrap}
  .sw{border:1px solid var(--mid-25);background:#fff;color:var(--slate);font-size:11.5px;font-weight:500;padding:6px 12px;border-radius:999px;transition:all .15s}
  .sw:hover{border-color:var(--pine);color:var(--pine)} .sw[aria-selected="true"]{border-color:var(--pine);background:rgba(0,162,131,.08);color:var(--pine);font-weight:600}
  .sw:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
  .fp{border-radius:14px;background:#fff;border:1px solid var(--mid-25);box-shadow:0 10px 34px rgba(39,63,82,.10);overflow:hidden}
  .fp-top{height:6px;background:var(--blue)}
  .fp-hd{display:flex;align-items:center;gap:10px;padding:11px 15px;border-bottom:1px solid var(--border)}
  .fp-av{width:32px;height:32px;border-radius:999px;background:rgba(0,162,131,.10);color:var(--pine);display:grid;place-items:center;font-size:12px;font-weight:700}
  .fp-nm{font-size:13.5px;font-weight:600;color:var(--forge)} .fp-sb{font-size:10.5px;color:var(--muted)}
  .fp-mis{margin-left:auto;font-size:10px;color:var(--muted);background:var(--stone);border:1px solid var(--border);padding:3px 9px;border-radius:999px}
  .fp-modes{display:flex;gap:4px;padding:7px 15px 0} .fpm{font-size:10.5px;font-weight:600;color:var(--mid-45);padding:4px 10px} .fpm.on{color:var(--pine);border-bottom:2px solid var(--pine)}
  .fp-body{padding:11px;display:flex;flex-direction:column;gap:9px;background:var(--stone)}
  .card{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden}
  /* children card (configurable) */
  .card.child{border-left:3px solid var(--blue)}
  .c-hd{display:flex;align-items:center;gap:8px;padding:10px 14px 3px} .c-q{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--blue)} .cfg{margin-left:auto;font-size:9px;font-weight:600;color:var(--muted);background:var(--stone);border:1px solid var(--border);border-radius:999px;padding:2px 8px}
  .c-grp{padding:7px 14px;border-top:1px solid #f4f6f9} .c-grp:first-of-type{border-top:none}
  .eyebrow{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--mid-40);margin-bottom:3px}
  .val{font-size:13px;font-weight:600;color:var(--forge)} .sub{font-size:11.5px;color:var(--slate);margin-top:1px}
  .badges{display:flex;gap:6px;flex-wrap:wrap;padding:8px 14px 11px} .badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--stone);border:1px solid var(--border);color:var(--slate)} .badge.pine{background:rgba(0,162,131,.08);color:var(--pine);border-color:rgba(0,162,131,.25)} .badge.gold{background:rgba(219,192,120,.14);color:var(--gold-dark);border-color:rgba(208,173,80,.4)}
  /* scheduling card (platform) */
  .card.sched{border-left:3px solid var(--pine)}
  .s-hd{display:flex;align-items:center;gap:8px;padding:10px 14px 3px} .s-q{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--slate)} .plat{margin-left:auto;font-size:9px;font-weight:600;color:var(--pine)}
  .s-room{padding:2px 14px 0;font-size:15px;font-weight:600;color:var(--forge)} .s-pat{padding:1px 14px 0;font-size:13px;color:var(--forge)} .s-eff{padding:2px 14px 0;font-size:12px;color:var(--muted)} .s-rate{padding:2px 14px 0;font-size:12px;color:var(--forge);font-weight:500}
  .s-ft{padding:9px 14px 11px;display:flex;gap:8px;align-items:center} .s-view{font-size:12px;font-weight:600;color:var(--pine)}
  /* schedule timeline rows */
  .sgroup{padding:8px 14px;border-top:1px solid #f4f6f9} .sglab{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--mid-40);margin-bottom:5px}
  .srow{display:flex;align-items:flex-start;gap:10px;padding:6px 0;border-bottom:1px solid #f6f8fa} .srow:last-child{border-bottom:none}
  .stag{flex:0 0 auto;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:999px;margin-top:2px}
  .stag.cur{background:rgba(0,162,131,.10);color:var(--pine)} .stag.fut{background:rgba(0,69,140,.08);color:var(--blue)} .stag.tmp{background:rgba(219,192,120,.16);color:var(--gold-dark)} .stag.end{background:var(--stone);color:var(--muted)}
  .sv{font-size:12.5px;font-weight:600;color:var(--forge)} .sd{font-size:11px;color:var(--muted);margin-top:1px} .sr{font-size:11px;color:var(--slate);margin-top:1px}
  /* mini context cards */
  .mc{background:#fff;border:1px solid var(--border);border-radius:10px;padding:8px 13px} .mc.at{border-left:3px solid var(--slate)} .mc.bl{border-left:3px solid var(--gold-dark)}
  .mc-q{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mid-40)} .mc-v{font-size:12px;font-weight:600;color:var(--forge);margin-top:1px} .mc-s{font-size:11px;color:var(--slate)}
  /* command surface (pattern editor) */
  .cmd{background:#fff;border:1px solid var(--mid-25);border-radius:12px;box-shadow:0 8px 26px rgba(39,63,82,.12);overflow:hidden}
  .cmd-hd{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border)} .cmd-t{font-size:13px;font-weight:600;color:var(--forge)} .cmd-x{margin-left:auto;color:var(--mid-40)}
  .cmd-step{padding:11px 14px;border-bottom:1px solid #f1f3f6} .cmd-l{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mid-40);margin-bottom:7px}
  .days{display:flex;gap:6px} .day{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--muted);background:var(--stone);border:1px solid var(--border)} .day.on{background:rgba(0,162,131,.10);color:var(--pine);border-color:rgba(0,162,131,.35)} .day.off{opacity:.55}
  .hours{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--forge);font-weight:600} .roompill{font-size:11.5px;color:var(--slate);background:var(--stone);border:1px solid var(--border);border-radius:8px;padding:5px 10px}
  .ovr{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--forge);background:var(--stone);border:1px solid var(--border);border-radius:8px;padding:7px 10px} .ovr .od{font-weight:600} .ovr .ot{color:var(--slate)} .ovr .ox{margin-left:auto;color:var(--mid-40);font-size:11px}
  .addovr{font-size:11.5px;font-weight:600;color:var(--pine);margin-top:8px;display:inline-block}
  .effrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--forge)} .field{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--mid-25);border-radius:8px;padding:6px 10px} .field .fx{color:var(--mid-40);font-size:11px} .chk{font-size:12px;color:var(--slate);display:inline-flex;align-items:center;gap:6px} .box{width:14px;height:14px;border-radius:4px;border:2px solid var(--mid-25)}
  .cmd-ft{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--stone)} .cmd-note{font-size:10.5px;color:var(--muted)}
  .bp{display:inline-flex;align-items:center;gap:6px;border-radius:7px;background:var(--pine);padding:7px 13px;font-size:12px;font-weight:600;color:#fff;margin-left:auto} .bp:hover{background:var(--pine-hover)}
  .bs{display:inline-flex;align-items:center;gap:6px;border-radius:7px;border:1px solid var(--mid-25);background:#fff;padding:6px 11px;font-size:11.5px;font-weight:500;color:var(--mid-70)}
  /* household */
  .hh-hd{padding:10px 14px 3px} .hh-q{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--slate)}
  .hrow{display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid #f4f6f9;cursor:pointer} .hrow:hover{background:rgba(0,162,131,.03)}
  .hav{width:28px;height:28px;border-radius:999px;background:var(--stone);color:var(--forge);display:grid;place-items:center;font-size:10px;font-weight:600} .hnm{font-size:13px;font-weight:600;color:var(--forge)} .hs{font-size:11px;color:var(--muted)} .hb{margin-left:auto;font-size:10px;font-weight:600;padding:2px 8px;border-radius:999px} .hb.ok{background:rgba(0,162,131,.10);color:var(--pine)} .hb.need{background:rgba(219,192,120,.16);color:var(--gold-dark)} .hopen{margin-left:8px;color:var(--mid-25)}
  .screen{display:none}.screen.on{display:block} .lab{font-size:11px;color:var(--muted);text-align:center;margin:8px 0 0}
</style>

<div class="frame">
  <div class="switch" role="tablist" aria-label="Screens">
    <button class="sw" role="tab" aria-selected="true" data-s="composition">Two cards</button>
    <button class="sw" role="tab" aria-selected="false" data-s="schedules">Schedules</button>
    <button class="sw" role="tab" aria-selected="false" data-s="pattern">Pattern editor</button>
    <button class="sw" role="tab" aria-selected="false" data-s="rates">Rates</button>
    <button class="sw" role="tab" aria-selected="false" data-s="household">Household</button>
  </div>
  <div id="stage"></div>
</div>

<script>
(function(){
  function panel(av,nm,sub,mis,body){return '<div class="fp"><div class="fp-top"></div><div class="fp-hd"><div class="fp-av">'+av+'</div><div><div class="fp-nm">'+nm+'</div><div class="fp-sb">'+sub+'</div></div><div class="fp-mis">'+mis+'</div></div><div class="fp-modes"><span class="fpm on">Work</span><span class="fpm">Activity</span></div><div class="fp-body">'+body+'</div></div>';}

  var CHILDCARD='<div class="card child"><div class="c-hd"><span class="c-q">Children</span><span class="cfg">Configurable</span></div>'
    +'<div class="c-grp"><div class="eyebrow">Child</div><div class="val">Ethan Rivera</div><div class="sub">Born Mar 2023 · Toddler</div></div>'
    +'<div class="c-grp"><div class="eyebrow">Guardians</div><div class="val">Maria &amp; Luis Rivera</div><div class="sub">Rivera household</div></div>'
    +'<div class="c-grp"><div class="eyebrow">Allergies</div><div class="val">Peanuts</div></div>'
    +'<div class="badges"><span class="badge pine">Scheduled</span><span class="badge">Immunizations current</span><span class="badge gold">Field trip form due</span></div></div>';

  var SCHEDCARD_SUMMARY='<div class="card sched"><div class="s-hd"><span class="s-q">Schedule</span><span class="plat">Scheduled</span></div>'
    +'<div class="s-room">Sunshine · Toddler</div><div class="s-pat">Monday–Friday · 8:30–5:30</div><div class="s-eff">Starts Jul 28 · open-ended</div><div class="s-rate">$980 / month</div>'
    +'<div class="s-ft"><span class="s-view">View schedule →</span></div></div>';

  var COMPOSITION=panel('ER','Ethan Rivera','Toddler · Maple Street','Review',
    CHILDCARD+SCHEDCARD_SUMMARY
    +'<div class="mc bl"><div class="mc-q">Billing</div><div class="mc-v">$980 / month projected</div><div class="mc-s">invoices &amp; balance owned by Billing</div></div>')
    +'<div class="lab">One Focus Panel, two peer cards: the <b style="color:var(--blue)">Children</b> card is operator-configured; the <b style="color:var(--pine)">Scheduling</b> card is platform-owned. Neither is embedded in the other.</div>';

  var SCHEDULES=panel('ER','Ethan Rivera','Toddler · Maple Street','Review schedule',
    '<div class="card sched"><div class="s-hd"><span class="s-q">Schedule</span><span class="plat">Scheduled</span></div>'
    +'<div class="sgroup" style="border-top:none"><div class="sglab">Current</div>'
    +'<div class="srow"><span class="stag cur">Now</span><div><div class="sv">Sunshine · Mon–Fri · 8:30–5:30</div><div class="sd">Starts Jul 28 · open-ended</div><div class="sr">$980 / month</div></div></div></div>'
    +'<div class="sgroup"><div class="sglab">Temporary</div>'
    +'<div class="srow"><span class="stag tmp">Temp</span><div><div class="sv">Rainbow · Thursdays only</div><div class="sd">Jul 24 – Aug 15 · returns to Sunshine</div></div></div></div>'
    +'<div class="sgroup"><div class="sglab">Future</div>'
    +'<div class="srow"><span class="stag fut">Sep 2</span><div><div class="sv">Rainbow · Mon–Fri (fall)</div><div class="sd">Begins Sep 2 · open-ended</div><div class="sr">$1,040 / month</div></div></div></div>'
    +'<div class="sgroup"><div class="sglab">History</div>'
    +'<div class="srow"><span class="stag end">Ended</span><div><div class="sv">Sunflower · Mon–Fri</div><div class="sd">Ended Jun 30</div></div></div></div>'
    +'<div class="s-ft"><button class="bs">Change schedule</button><button class="bs">Add future schedule</button><button class="bs">Temporary move</button></div></div>')
    +'<div class="lab">A child has many schedules over time — current, temporary, future and history — all on the platform Scheduling card. End dates are never hidden.</div>';

  var PATTERN=panel('ER','Ethan Rivera','Toddler · Maple Street','Change schedule',
    '<div class="card sched" style="opacity:.5"><div class="s-hd"><span class="s-q">Schedule</span></div><div class="s-room">Sunshine · Mon–Fri</div></div>'
    +'<div class="cmd"><div class="cmd-hd"><span class="cmd-t">Schedule pattern · Ethan</span><span class="cmd-x">✕</span></div>'
    +'<div class="cmd-step"><div class="cmd-l">Days</div><div class="days"><span class="day on">M</span><span class="day on">T</span><span class="day on">W</span><span class="day on">T</span><span class="day on">F</span><span class="day off">S</span><span class="day off">S</span></div></div>'
    +'<div class="cmd-step"><div class="cmd-l">Default hours &amp; room</div><div class="hours">8:30 <span style="color:var(--mid-40)">–</span> 5:30 <span class="roompill">Room Sunshine</span></div></div>'
    +'<div class="cmd-step"><div class="cmd-l">Overrides (optional)</div><div class="ovr"><span class="od">Tuesday</span><span class="ot">9:30–5:30</span><span class="ox">✕</span></div><span class="addovr">+ Add a day override</span></div>'
    +'<div class="cmd-step"><div class="cmd-l">Effective</div><div class="effrow"><span>from</span><span class="field">Jul 28<span class="fx">▾</span></span><span class="chk"><span class="box"></span> temporary (set end date)</span></div></div>'
    +'<div class="cmd-ft"><span class="cmd-note">Set the minimum; override only exceptions.</span><button class="bp">Commit schedule</button></div></div>')
    +'<div class="lab">The pattern editor: days + default hours + optional per-day override + room + effective dates + temporary. Configure the minimum.</div>';

  var RATES=panel('ER','Ethan Rivera','Toddler · Maple Street','Review schedule',
    '<div class="card sched"><div class="s-hd"><span class="s-q">Schedule</span><span class="plat">Scheduled</span></div>'
    +'<div class="s-room">Sunshine · Toddler</div><div class="s-pat">Monday–Friday · 8:30–5:30</div><div class="s-eff">Starts Jul 28 · open-ended</div>'
    +'<div class="sgroup" style="margin-top:4px"><div class="sglab">Rate</div>'
    +'<div class="srow"><span class="stag cur">Now</span><div><div class="sv">$980 / month</div><div class="sd">Projected recurring tuition</div><div class="sr" style="color:var(--gold-dark)">Subsidy applies · funded amount owned by Billing</div></div></div>'
    +'<div class="srow"><span class="stag fut">Sep 2</span><div><div class="sv">$1,040 / month</div><div class="sd">From the fall schedule</div></div></div></div>'
    +'<div class="mc bl"><div class="mc-q">Billing</div><div class="mc-v">Invoices &amp; balance</div><div class="mc-s">the ledger is owned by Billing, not Scheduling</div></div>'
    +'<div class="s-ft"><button class="bs">Change schedule</button></div></div>')
    +'<div class="lab">Scheduling shows the rate and projected tuition (a consequence of the schedule) and flags funding. Billing owns invoices, balances and payments.</div>';

  var HOUSEHOLD='<div class="fp"><div class="fp-top"></div><div class="fp-hd"><div class="fp-av" style="background:rgba(0,69,140,.08);color:var(--blue)">R</div><div><div class="fp-nm">Rivera household</div><div class="fp-sb">Maple Street · 3 children</div></div><div class="fp-mis">Household</div></div>'
    +'<div class="fp-body"><div class="card child"><div class="hh-hd"><span class="hh-q">Children</span></div>'
    +'<div class="hrow"><span class="hav">ER</span><div><div class="hnm">Ethan</div><div class="hs">Sunshine · Mon–Fri</div></div><span class="hb ok">Scheduled</span><span class="hopen">›</span></div>'
    +'<div class="hrow"><span class="hav">AV</span><div><div class="hnm">Ava</div><div class="hs">Rainbow · Tue/Thu</div></div><span class="hb ok">Scheduled</span><span class="hopen">›</span></div>'
    +'<div class="hrow"><span class="hav">MI</span><div><div class="hnm">Mia</div><div class="hs">Oak Ave</div></div><span class="hb need">Needs a room</span><span class="hopen">›</span></div>'
    +'</div></div></div>'
    +'<div class="lab">From the household, selecting a child opens that child\'s Focus Panel — the Children card and the Scheduling card. Navigation, not embedding.</div>';

  var S={composition:COMPOSITION,schedules:SCHEDULES,pattern:PATTERN,rates:RATES,household:HOUSEHOLD};
  var stage=document.getElementById('stage');
  document.querySelectorAll('.sw').forEach(function(b){b.addEventListener('click',function(){
    document.querySelectorAll('.sw').forEach(function(x){x.setAttribute('aria-selected',x.dataset.s===b.dataset.s?'true':'false');});
    stage.innerHTML=S[b.dataset.s];
  });});
  stage.innerHTML=S.composition;
})();
</script>
