<title>Scheduling — Alloy</title>
<style>
  :root{
    --pine:#00A283;--pine-hover:#009276;--forge:#273F52;--ink:#18273A;--slate:#45506c;--muted:#59678b;
    --stone:#F4F6F9;--gold:#DBC078;--gold-dark:#d0ad50;--ember:#BC4300;--blue:#00458C;--page:#EEF2F8;
    --font:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    --mid-90:rgba(39,63,82,.90);--mid-70:rgba(39,63,82,.70);--mid-62:rgba(39,63,82,.62);--mid-58:rgba(39,63,82,.58);
    --mid-45:rgba(39,63,82,.45);--mid-42:rgba(39,63,82,.42);--mid-40:rgba(39,63,82,.40);--mid-35:rgba(39,63,82,.35);--mid-25:rgba(39,63,82,.25);
    --stone-30:rgba(244,246,249,.30);color-scheme:light;
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{background:var(--page);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;font-size:13px;line-height:1.45}
  .tab{font-variant-numeric:tabular-nums} h1,h2,h3,h4{margin:0} button{font-family:inherit;cursor:pointer;border:none;background:none}
  .frame{max-width:1160px;margin:0 auto;padding:22px 18px 48px}
  .switch{display:flex;gap:6px;margin-bottom:14px;justify-content:center;flex-wrap:wrap}
  .sw{border:1px solid var(--mid-25);background:#fff;color:var(--slate);font-size:11.5px;font-weight:500;padding:6px 12px;border-radius:999px;transition:all .15s}
  .sw:hover{border-color:var(--pine);color:var(--pine)} .sw[aria-selected="true"]{border-color:var(--pine);background:rgba(0,162,131,.08);color:var(--pine);font-weight:600}
  .sw:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
  .app{display:flex;background:var(--stone);border-radius:16px;overflow:hidden;box-shadow:0 16px 48px rgba(39,63,82,.12);min-height:660px}
  .rail{width:56px;flex:0 0 56px;background:var(--forge);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:4px}
  .rl0{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--pine),#0b7d68);display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;margin-bottom:8px}
  .ri{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:rgba(255,255,255,.55);font-size:15px;position:relative} .ri.on{background:rgba(255,255,255,.10);color:#fff} .ri.on::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--pine)}
  .topbar{height:6px;background:var(--blue)} .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .shell{flex:1;display:flex;flex-direction:column;min-width:0;border-radius:16px;border:1px solid rgba(244,246,249,.9);background:#fff;overflow:hidden}
  .cband{border-bottom:1px solid var(--stone-30)}
  .whead{display:flex;align-items:center;justify-content:space-between;gap:12px;border-left:2px solid var(--pine);background:#fff;padding:8px 16px 0}
  .wid{display:flex;align-items:center;gap:8px;min-width:0} .wico{width:24px;height:24px;display:grid;place-items:center;color:var(--forge);font-size:15px}
  .wt{font-size:14px;font-weight:600;color:var(--forge);line-height:1.15} .ws2{font-size:11px;color:var(--slate)}
  .wacts{display:flex;align-items:center;gap:6px;margin-left:auto}
  .bp{display:inline-flex;align-items:center;gap:6px;border-radius:6px;background:var(--pine);padding:6px 12px;font-size:12.5px;font-weight:600;color:#fff} .bp:hover{background:var(--pine-hover)} .bp.dis{background:var(--mid-25);cursor:not-allowed}
  .bs{display:inline-flex;align-items:center;gap:6px;border-radius:8px;border:1px solid var(--mid-25);background:#fff;padding:6px 12px;font-size:12px;font-weight:500;color:var(--mid-70)}
  .bx{display:inline-flex;align-items:center;gap:4px;border-radius:6px;border:1px solid rgba(244,246,249,.8);padding:5px 9px;font-size:11px;font-weight:600;color:var(--mid-40)}
  .mnav{background:#fff;padding:6px 16px 12px} .subtabs{display:inline-flex;align-items:center;gap:14px;flex-wrap:wrap}
  .st{padding:2px 2px 7px;font-size:12.5px;font-weight:600;color:rgba(39,63,82,.5);border-bottom:2px solid transparent} .st.on{color:var(--pine);border-bottom-color:var(--pine)}
  .inset{display:flex;min-height:0;flex:1;flex-direction:column;background:#fff;padding:12px 16px 16px}
  .canvas{display:flex;min-height:0;flex:1;flex-direction:column;overflow:auto;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(244,246,249,.55);background:rgba(244,246,249,.5)}
  .canvas.white{background:#fff;box-shadow:none;padding:0}
  .surf{padding:18px} .surf .wrap{max-width:1010px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
  .eyebrow{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:var(--mid-35);margin:0 0 9px}
  .healthline{font-size:15px;line-height:1.5;color:var(--forge);font-weight:500} .healthline b{color:var(--ember);font-weight:600} .healthline .g{color:var(--pine);font-weight:600}
  /* zones/list */
  .zone{border-radius:12px;border:1px solid rgba(244,246,249,.9);background:#fff;box-shadow:0 2px 10px rgba(24,39,58,.07);padding:13px 16px}
  .zh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px} .zh h2{font-size:13px;font-weight:600;color:var(--forge)} .zh button{font-size:11px;font-weight:600;color:var(--pine)}
  .rl2{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
  .rl2 li{display:flex;align-items:center;gap:12px;border-radius:8px;padding:9px 6px;border-bottom:1px solid rgba(39,63,82,.05)} .rl2 li:last-child{border-bottom:none}
  .bar{width:2px;height:30px;flex:0 0 auto;border-radius:999px;background:var(--pine)} .bar.ember{background:var(--ember)} .bar.gold{background:var(--gold)} .bar.slate{background:var(--mid-25)}
  .lmain{min-width:0;flex:1} .llbl{font-size:13px;font-weight:600;color:var(--forge)} .lsub{font-size:11px;font-weight:500;color:var(--slate);margin-top:1px} .lsub.pine{color:var(--pine)} .lsub.ember{color:var(--ember)}
  .lcta{font-size:11.5px;font-weight:600;color:var(--pine);flex:0 0 auto}
  .hero{border-radius:14px;background:#fff;padding:16px 18px 16px 22px;position:relative;overflow:hidden;box-shadow:0 4px 20px rgba(24,39,58,.09);outline:1px solid rgba(188,67,0,.18)}
  .hero .rl{position:absolute;top:12px;bottom:12px;left:0;width:4px;border-radius:999px;background:var(--ember)}
  .hero h3{font-size:16px;font-weight:600;color:var(--forge)} .hero p{margin:5px 0 12px;font-size:12.5px;color:var(--slate)}
  .calm{display:flex;flex-direction:column;align-items:center;gap:8px;padding:40px 20px;text-align:center}
  .calm .big{font-size:34px} .calm h3{font-size:16px;color:var(--forge)} .calm p{font-size:12.5px;color:var(--muted);max-width:44ch}
  /* filters + groups */
  .filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .fchip{font-size:11px;font-weight:500;color:var(--slate);border:1px solid var(--mid-25);background:#fff;border-radius:999px;padding:4px 10px} .fchip.on{border-color:var(--pine);color:var(--pine);background:rgba(0,162,131,.06);font-weight:600} .fchip.saved{margin-left:auto;color:var(--blue);border-color:rgba(0,69,140,.3)}
  .grouphdr{display:flex;align-items:center;gap:8px;margin:4px 0 2px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mid-45)} .grouphdr .n{margin-left:auto;font-size:10.5px;color:var(--mid-40)}
  .grouphdr.ember{color:var(--ember)} .grouphdr.gold{color:var(--gold-dark)}
  .pager{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--muted);padding-top:6px}
  /* work unit */
  .wu{display:grid;grid-template-columns:20rem minmax(0,1fr);height:100%} @media (max-width:800px){.wu{grid-template-columns:1fr}}
  .qcol{padding:16px;overflow:auto;border-right:1px solid rgba(244,246,249,.9)}
  .qh{display:flex;align-items:baseline;justify-content:space-between;padding:0 2px 8px} .qh h3{font-size:13px;font-weight:600;color:var(--forge)} .qh .c{font-size:11px;color:var(--mid-45)}
  .ql{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
  .qr{display:block;width:100%;text-align:left;border-radius:8px;border:1px solid rgba(244,246,249,.9);border-left:2px solid rgba(244,246,249,.9);padding:9px 11px;box-shadow:0 1px 2px rgba(39,63,82,.05)} .qr.sel{border-color:rgba(0,162,131,.45);border-left-color:var(--pine);background:rgba(0,162,131,.06)} .qr.ember{border-left-color:var(--ember)}
  .qrt{display:flex;align-items:center;gap:6px} .qi{width:14px;height:14px;color:var(--mid-40)} .qtt{font-size:12.5px;font-weight:600;color:var(--mid-90)} .qp{margin-left:auto;border-radius:999px;padding:2px 7px;font-size:9px;font-weight:600} .qp.ember{background:rgba(188,67,0,.10);color:var(--ember)} .qp.gold{background:rgba(219,192,120,.18);color:var(--gold-dark)}
  .qs{margin-top:3px;font-size:11px;color:var(--mid-58)}
  .fph{padding:16px;overflow:auto;background:rgba(244,246,249,.35)}
  .fp{border-radius:12px;background:#fff;border:1px solid rgba(39,63,82,.20);box-shadow:0 1px 3px rgba(15,23,42,.06);overflow:hidden}
  .fphd{display:flex;align-items:center;gap:9px;padding:11px 13px;border-bottom:1px solid rgba(39,63,82,.07)}
  .fpav{width:32px;height:32px;border-radius:999px;display:grid;place-items:center;font-size:13px;font-weight:700;background:rgba(0,162,131,.10);color:var(--pine)} .fpav.ember{background:rgba(188,67,0,.10);color:var(--ember)} .fpav.forge{background:rgba(39,63,82,.08);color:var(--forge)}
  .fpnm{font-size:13.5px;font-weight:600;color:var(--forge)} .fpsb{font-size:10.5px;color:var(--muted)}
  .fpmodes{margin-left:auto;display:flex;gap:4px} .fpm{font-size:10px;font-weight:600;color:var(--mid-45);padding:3px 9px;border-radius:999px;border:1px solid var(--mid-25);background:#fff} .fpm.on{background:var(--pine);color:#fff;border-color:var(--pine)}
  .dcard{margin:12px;border:1px solid rgba(39,63,82,.14);border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(24,39,58,.06)} .dcard.place{border-left:3px solid var(--pine)} .dcard.issue{border-left:3px solid var(--ember)}
  .dsec{padding:12px 14px;border-bottom:1px solid rgba(39,63,82,.07)} .dsec:last-child{border-bottom:none}
  .dlabel{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--mid-40);display:flex;align-items:center;justify-content:space-between}
  .dsev{font-size:9.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:rgba(188,67,0,.10);color:var(--ember)}
  .dprob{margin-top:6px;font-size:15px;font-weight:600;color:var(--forge);line-height:1.3} .dprob small{display:block;font-size:11.5px;font-weight:500;color:var(--muted);margin-top:2px}
  .opt{display:flex;align-items:flex-start;gap:10px;padding:10px 6px;border-bottom:1px solid rgba(39,63,82,.05)} .opt:last-child{border-bottom:none}
  .orad{width:15px;height:15px;border-radius:50%;border:2px solid var(--mid-25);flex:0 0 auto;margin-top:1px;position:relative} .opt.on .orad{border-color:var(--pine)} .opt.on .orad::after{content:"";position:absolute;inset:2px;border-radius:50%;background:var(--pine)}
  .opt.blocked{opacity:.6} .opt.blocked .orad{border-style:dashed}
  .onm{font-size:13px;font-weight:600;color:var(--forge)} .opt.off .onm,.opt.blocked .onm{font-weight:500;color:var(--mid-70)}
  .obadges{display:flex;gap:6px;margin-top:3px;flex-wrap:wrap} .ob{font-size:9.5px;font-weight:600;padding:2px 7px;border-radius:999px} .ob.pine{background:rgba(0,162,131,.10);color:var(--pine)} .ob.gold{background:rgba(219,192,120,.18);color:var(--gold-dark)} .ob.ember{background:rgba(188,67,0,.10);color:var(--ember)} .ob.slate{background:rgba(69,80,108,.10);color:var(--slate)} .ob.blue{background:rgba(0,69,140,.08);color:var(--blue)}
  .otag{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-left:auto;flex:0 0 auto;padding-top:2px} .otag.rec{color:var(--pine)} .otag.elig{color:var(--slate)} .otag.trade{color:var(--gold-dark)} .otag.block{color:var(--ember)}
  .shapes{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px} .shape{font-size:10.5px;font-weight:500;color:var(--slate);border:1px solid var(--mid-25);border-radius:8px;padding:4px 9px} .shape.on{border-color:var(--pine);color:var(--pine);background:rgba(0,162,131,.06);font-weight:600}
  .cont{margin-top:8px;font-size:11px;color:var(--slate);background:rgba(219,192,120,.10);border:1px solid rgba(219,192,120,.3);border-radius:8px;padding:8px 10px} .cont b{color:var(--forge)}
  .kv{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;padding:5px 0;border-bottom:1px solid rgba(39,63,82,.06)} .kv:last-child{border-bottom:none} .kv .k{color:var(--muted)} .kv .v{color:var(--forge);font-weight:500}
  .tmeta{font-size:11px;color:var(--slate)} .tmeta b{color:var(--forge)}
  .dfoot{padding:12px 14px;display:flex;align-items:center;gap:10px} .dfoot .note{font-size:10.5px;color:var(--muted)} .dcommit{margin-left:auto;display:inline-flex;align-items:center;gap:6px;border-radius:8px;background:var(--pine);padding:8px 16px;font-size:12.5px;font-weight:600;color:#fff}
  /* child list (roster drill-down) */
  .childlist{display:flex;flex-direction:column;gap:0} .crow{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid rgba(39,63,82,.05)} .crow:last-child{border-bottom:none}
  .cav{width:26px;height:26px;border-radius:999px;background:var(--stone);color:var(--forge);display:grid;place-items:center;font-size:10px;font-weight:600;flex:0 0 auto}
  .cnm{font-size:12.5px;font-weight:500;color:var(--forge)} .cpat{font-size:10.5px;color:var(--muted)} .cwarn{margin-left:auto;font-size:9.5px;font-weight:600;color:var(--ember);background:rgba(188,67,0,.08);padding:2px 7px;border-radius:999px} .cok{margin-left:auto;font-size:9.5px;color:var(--pine)}
  /* banners */
  .banner{border-radius:10px;padding:10px 12px;font-size:11.5px;display:flex;align-items:center;gap:8px}
  .banner.warn{background:rgba(219,192,120,.12);border:1px solid rgba(219,192,120,.4);color:#7a5c14} .banner.stale{background:rgba(0,69,140,.06);border:1px solid rgba(0,69,140,.2);color:var(--blue)} .banner b{font-weight:600}
  .banner button{margin-left:auto;font-size:11px;font-weight:600;color:inherit;text-decoration:underline}
  .success{display:flex;flex-direction:column;align-items:center;gap:8px;padding:26px 18px;text-align:center} .success .ck{width:44px;height:44px;border-radius:999px;background:rgba(0,162,131,.12);color:var(--pine);display:grid;place-items:center;font-size:22px} .success h3{font-size:15px;color:var(--forge)} .success p{font-size:12px;color:var(--muted)}
  .undo{display:inline-flex;gap:8px;align-items:center;font-size:12px;color:var(--slate)} .undo button{font-size:12px;font-weight:600;color:var(--pine);text-decoration:underline}
  .screen{display:none}.screen.on{display:block}
</style>

<div class="frame">
  <div class="switch" role="tablist" aria-label="States">
    <button class="sw" role="tab" aria-selected="true" data-s="zero">Overview · all clear</button>
    <button class="sw" role="tab" aria-selected="false" data-s="high">Overview · high volume</button>
    <button class="sw" role="tab" aria-selected="false" data-s="place">Place · options</button>
    <button class="sw" role="tab" aria-selected="false" data-s="noroom">Place · no room</button>
    <button class="sw" role="tab" aria-selected="false" data-s="ratio">Over ratio · move</button>
    <button class="sw" role="tab" aria-selected="false" data-s="drill">Roster · who's included</button>
    <button class="sw" role="tab" aria-selected="false" data-s="child">Child panel</button>
    <button class="sw" role="tab" aria-selected="false" data-s="commit">Commit &amp; undo</button>
    <button class="sw" role="tab" aria-selected="false" data-s="degraded">Degraded data</button>
  </div>

  <div class="app">
    <nav class="rail" aria-hidden="true"><div class="rl0">A</div><div class="ri">◫</div><div class="ri">◷</div><div class="ri on">▦</div><div class="ri">✉</div><div class="ri">◧</div><div class="ri">▤</div></nav>
    <div class="main"><div class="topbar"></div><div class="shell">
      <div class="cband">
        <div class="whead"><div class="wid"><span class="wico">▦</span><div><div class="wt">Scheduling</div><div class="ws2" id="sub"></div></div></div>
          <div class="wacts"><button class="bs">This week ▾</button><button class="bp" id="act">Fix next</button><button class="bx">✕ Close</button></div></div>
        <div class="mnav"><div class="subtabs" id="subtabs"></div></div>
      </div>
      <div class="inset"><div class="canvas" id="canvas">
        <section class="screen on" id="s-zero"></section>
        <section class="screen" id="s-high"></section>
        <section class="screen" id="s-place"></section>
        <section class="screen" id="s-noroom"></section>
        <section class="screen" id="s-ratio"></section>
        <section class="screen" id="s-drill"></section>
        <section class="screen" id="s-child"></section>
        <section class="screen" id="s-commit"></section>
        <section class="screen" id="s-degraded"></section>
      </div></div>
    </div></div>
  </div>
</div>

<script>
(function(){
  var sub={zero:"Maple Street · week of Jul 20",high:"3 sites · week of Jul 20",place:"Place Ethan · starts Monday",noroom:"Place Sofia · starts Monday",ratio:"Sunflower over ratio · Thursday",drill:"Roster · Sunflower Thursday",child:"Ethan Rivera · scheduling",commit:"Move Ethan → Sunshine · Thursday",degraded:"Maple Street · staffing not connected"};
  var act={zero:"Open roster",high:"Review group",place:"Commit placement",noroom:"Adjust request",ratio:"Commit",drill:"Fix Thursday",child:"Place Ethan",commit:"Done",degraded:"Fix Thursday"};
  var subtabs={zero:"Overview",high:"Overview",place:"Overview",noroom:"Overview",ratio:"Overview",drill:"Roster",child:"Overview",commit:"Overview",degraded:"Overview"};

  var ZERO='<div class="surf"><div class="wrap">'
    +'<div class="zone"><div class="healthline"><span class="g">All rooms are in ratio this week</span> and every enrolled child has a room. Nothing needs a decision.</div></div>'
    +'<div class="calm"><div class="big" style="color:var(--pine)">✓</div><h3>You\'re all set for the week</h3><p>Four changes were committed today. Open the roster to see the week, or check back as new enrollments arrive.</p><button class="bs">Open roster →</button></div>'
    +'<div class="zone"><div class="zh"><h2>Committed today</h2><button>History</button></div><ul class="rl2">'
    +'<li><span class="bar gold"></span><span class="lmain"><span class="llbl">Noah → Rainbow</span><span class="lsub pine">full week · in ratio</span></span></li>'
    +'<li><span class="bar gold"></span><span class="lmain"><span class="llbl">Priya → Sunshine</span><span class="lsub pine">Mon–Thu</span></span></li>'
    +'</ul></div>'
    +'</div></div>';

  var HIGH='<div class="surf"><div class="wrap">'
    +'<div class="zone"><div class="healthline">Across your sites this week: <b>6 rooms will exceed ratio</b> and <b>40 children still need rooms</b> this term. <span class="g">Most rooms are healthy.</span></div></div>'
    +'<div class="filters"><span class="fchip on">This week</span><span class="fchip">Over ratio</span><span class="fchip">Needs a room</span><span class="fchip">Maple St</span><span class="fchip">Oak Ave</span><span class="fchip saved">★ My sites, over-ratio</span></div>'
    +'<div class="zone">'
    +'<div class="grouphdr ember">Over ratio · this week<span class="n">6 rooms</span></div><ul class="rl2">'
    +'<li><span class="bar ember"></span><span class="lmain"><span class="llbl">Sunflower · Thu — Maple St</span><span class="lsub ember">12 of 11 · 2 fixes need no staff</span></span><span class="lcta">Fix →</span></li>'
    +'<li><span class="bar ember"></span><span class="lmain"><span class="llbl">Bluebird · Wed — Oak Ave</span><span class="lsub ember">19 of 18</span></span><span class="lcta">Fix →</span></li>'
    +'<li><span class="bar ember"></span><span class="lmain"><span class="llbl">+ 4 more rooms over ratio</span><span class="lsub">grouped · step through</span></span><span class="lcta">Review →</span></li>'
    +'</ul>'
    +'<div class="grouphdr gold" style="margin-top:10px">Needs a room · this term<span class="n">40 children</span></div><ul class="rl2">'
    +'<li><span class="bar gold"></span><span class="lmain"><span class="llbl">Ethan Rivera + 12 toddlers</span><span class="lsub">start Mon–Fri · Maple St</span></span><span class="lcta">Review →</span></li>'
    +'<li><span class="bar gold"></span><span class="lmain"><span class="llbl">27 more across 2 sites</span><span class="lsub">grouped by site → room</span></span><span class="lcta">Review →</span></li>'
    +'</ul>'
    +'<div class="pager"><span>Showing 2 groups · 46 decisions</span><span>Grouped by severity → site → room · ‹ 1 of 3 ›</span></div>'
    +'</div>'
    +'</div></div>';

  function opt(cls,on,name,badges,tag,body){
