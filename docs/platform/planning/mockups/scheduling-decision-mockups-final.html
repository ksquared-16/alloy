<title>Scheduling — Alloy</title>
<style>
  :root{

  .kv2{font-size:18px;font-weight:700;letter-spacing:-.03em;line-height:1;color:var(--forge)} .kl{display:flex;align-items:center;gap:6px;margin-top:6px} .kg{width:8px;height:8px;transform:rotate(45deg)} .kg.pine{background:var(--pine)} .kg.gold{background:var(--gold)} .kg.ember{background:var(--ember)} .klbl{font-size:10px;font-weight:500;color:var(--mid-42)}

  .rl2{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}

  .fpnm{font-size:13.5px;font-weight:600;color:var(--forge)} .fpsb{font-size:10.5px;color:var(--muted)}
  .fpmodes{margin-left:auto;display:flex;gap:4px} .fpm{font-size:10px;font-weight:600;color:var(--mid-45);padding:3px 9px;border-radius:999px;border:1px solid var(--mid-25);background:#fff} .fpm.on{background:var(--pine);color:#fff;border-color:var(--pine)}

  .opt{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid rgba(39,63,82,.05)} .opt:last-child{border-bottom:none}
  .oradio{width:15px;height:15px;border-radius:50%;border:2px solid var(--mid-25);flex:0 0 auto;position:relative} .opt.on .oradio{border-color:var(--pine)} .opt.on .oradio::after{content:"";position:absolute;inset:2px;border-radius:50%;background:var(--pine)}
  .onm{font-size:13px;font-weight:600;color:var(--forge)} .opt.off .onm{font-weight:500;color:var(--mid-70)}
  .orec{font-size:9.5px;font-weight:600;color:var(--pine);background:rgba(0,162,131,.10);padding:2px 7px;border-radius:999px;margin-left:auto}

<div class="frame">
  <div class="switch" role="tablist" aria-label="Screens">
    <button class="sw" role="tab" aria-selected="true" data-s="overview">Overview</button>
    <button class="sw" role="tab" aria-selected="false" data-s="decision">A decision</button>
    <button class="sw" role="tab" aria-selected="false" data-s="roster">Roster</button>
  </div>

  <div class="app">
    <nav class="rail" aria-hidden="true"><div class="rail-logo">A</div><div class="rail-i">◫</div><div class="rail-i">◷</div><div class="rail-i on">▦</div><div class="rail-i">✉</div><div class="rail-i">◧</div><div class="rail-i">▤</div></nav>
    <div class="main">
      <div class="topbar"></div>
      <div class="shell">
        <div class="cband">
          <div class="whead"><div class="wid"><span class="wico">▦</span><div><div class="wtitle">Scheduling</div><div class="wsub" id="sub">Maple Street · week of Jul 20</div></div></div>
            <div class="wacts"><button class="bs">This week ▾</button><button class="bp" id="act">Resolve</button><button class="bx">✕ Close</button></div></div>
          <div class="mnav"><div class="msplit">
            <div class="subtabs" id="subtabs"></div>
            <div class="oph" id="oph"></div>
          </div></div>
        </div>
        <div class="inset"><div class="canvas" id="canvas">
          <section class="screen on" id="s-overview"></section>
          <section class="screen" id="s-decision"></section>
          <section class="screen" id="s-roster"></section>
        </div></div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  var subtabs={
    overview:[["Overview",1],["Roster",0],["Attendance",0],["Insights",0]],
    decision:[["Overview",1],["Roster",0],["Attendance",0],["Insights",0]],
    roster:[["Overview",0],["Roster",1],["Attendance",0],["Insights",0]]
  };
  var oph={
    overview:[["3","To decide","ember","2 today","ember"],["7/8","Rooms in ratio","pine","",""],["86%","Fill","pine","",""]],
    decision:[["3","To decide","ember","",""],["3","Options","pine","",""],["0","Blocking","pine","",""]],
    roster:[["7/8","In ratio","pine","",""],["1","Over","ember","Sunflower Thu","ember"],["86%","Fill","pine","",""]]
  };
  var sub={overview:"Maple Street · week of Jul 20",decision:"Sunflower over ratio · Thursday",roster:"Maple Street · week of Jul 20"};
  var act={overview:"Resolve",decision:"Commit",roster:"Resolve"};

  var OVERVIEW='<div class="surf"><div class="wrap">'
    +'<div><p class="eyebrow">To decide</p><div class="acards">'
    +'<button class="ac p2"><span class="rl"></span><span class="aw ember">▲</span><span class="ah">Sunflower over ratio</span><p class="ap">Thursday projects 12 children in a room that holds 11. Choose how to bring it back in line.</p><span class="acta ember">Resolve →</span></button>'
    +'<button class="ac p1"><span class="rl"></span><span class="aw pine">◑</span><span class="ah">Ethan needs a room</span><p class="ap">Starts Monday. No room set yet — two rooms fit, one keeps his sibling\'s cohort.</p><span class="acta">Resolve →</span></button>'
    +'<button class="ac p3"><span class="aw forge">◷</span><span class="ah">Lila\'s start date</span><p class="ap">Infant room is tight Tue and Thu. Starting a day later avoids it with no cost.</p><span class="acta forge">Resolve →</span></button>'
    +'</div></div>'
    +'<div><p class="eyebrow">This week</p><div class="kpis">'
    +'<div class="kpi"><span class="kw ember">▲</span><div><div class="kv2 tab">3</div><div class="kl"><span class="kg ember"></span><span class="klbl">To decide</span></div></div></div>'
    +'<div class="kpi"><span class="kw pine">◱</span><div><div class="kv2 tab">7/8</div><div class="kl"><span class="kg pine"></span><span class="klbl">Rooms in ratio</span></div></div></div>'

    +'<div class="kpi"><span class="kw gold">✓</span><div><div class="kv2 tab">4</div><div class="kl"><span class="kg gold"></span><span class="klbl">Decided today</span></div></div></div>'

  var DECISION='<div class="wu">'
    +'<div class="qcol"><div class="qh"><h3>To decide</h3><span class="c tab">3</span></div><ul class="ql">'
    +'<li><button class="qr sel ember"><div class="qrt"><span class="qi">▲</span><span class="qtt">Sunflower over ratio</span><span class="qp ember">Thu</span></div><p class="qs">12 of 11 · 3 options</p></button></li>'
    +'<li><button class="qr"><div class="qrt"><span class="qi">◔</span><span class="qtt">Ethan needs a room</span><span class="qp gold">Mon</span></div><p class="qs">Sunshine or Rainbow</p></button></li>'
    +'<li><button class="qr"><div class="qrt"><span class="qi">◔</span><span class="qtt">Lila\'s start date</span><span class="qp gold">Tue</span></div><p class="qs">infant room tight</p></button></li>'
    +'</ul></div>'
    +'<div class="fph"><div class="fp">'
    +'<div class="fphd"><div class="fpav">▲</div><div><div class="fpnm">Sunflower · Thursday</div><div class="fpsb">Toddler room</div></div><div class="fpmodes"><span class="fpm on">Decide</span><span class="fpm">History</span></div></div>'
    +'<div class="dcard">'
    +'<div class="dsec"><div class="dlabel"><span>What needs deciding</span><span class="dsev">Over ratio</span></div><div class="dprob">Thursday has 12 children in a room that holds 11<small>Ava\'s enrollment starts Thursday, putting the room one over its two-teacher limit.</small></div></div>'
    +'<div class="dsec"><div class="dlabel"><span>Options</span></div>'
    +'<div class="opt on"><span class="oradio"></span><div style="min-width:0;flex:1"><span class="onm">Move Ethan to Sunshine</span><div class="odesc">Sunshine has room every day · keeps Ethan with his cohort</div></div><span class="orec">Recommended</span></div>'
    +'<div class="opt off"><span class="oradio"></span><div style="min-width:0;flex:1"><span class="onm">Add a teacher Thursday</span><div class="odesc">Allows up to 17 · adds ~$180 in labor</div></div></div>'
    +'<div class="opt off"><span class="oradio"></span><div style="min-width:0;flex:1"><span class="onm">Drop one Thursday session</span><div class="odesc">Back within ratio · loses $62 in tuition</div></div></div>'
    +'</div>'
    +'<div class="dsec"><div class="dlabel"><span>What changes</span></div>'
    +'<div class="trade"><div class="tside now"><div class="te">Now</div><div class="tv tab">12 / 11</div><div class="td">over ratio</div></div><div class="tarrow">→</div><div class="tside then"><div class="te">After</div><div class="tv tab">11 / 11</div><div class="td">in ratio</div></div></div>'
    +'<div class="tmeta"><span>Labor <b>no change</b></span><span>Tuition <b>no change</b></span><span>Conflicts <b>none</b></span></div></div>'
    +'<div class="dfoot"><span class="note">Nothing changes until you commit.</span><button class="dcommit">Commit</button></div>'
    +'</div></div></div>'
    +'</div>';

  function cell(o,c,pct,rr,dot,cls){return '<td class="cell '+(cls||'')+'"><div class="occ tab">'+o+'</div><div class="cap">'+c+'</div><div class="cbar"><i style="width:'+pct+'%"></i></div><div class="crr"><span class="dot '+dot+'"></span>'+rr+'</div></td>';}
  var ROSTER='<div class="surf"><div class="wrap">'
    +'<div class="rostertop"><div class="weekpick"><button>‹</button><button class="mid">Jul 20 – 24</button><button>›</button></div><span style="font-size:11.5px;color:var(--muted)">142 children · 8 rooms</span></div>'
    +'<div class="board"><table><thead><tr><th>Room</th><th>Mon 20</th><th>Tue 21</th><th>Wed 22</th><th class="now">Thu 23</th><th>Fri 24</th></tr></thead><tbody>'
    +'<tr><td class="rc"><div class="rn">Sunflower</div><div class="rm">Toddler · holds 11</div></td>'+cell(9,'of 11',82,'2 staff','pine')+cell(10,'of 11',91,'2 staff','pine')+cell(10,'of 11',91,'2 staff','pine')+cell(12,'of 11',100,'over','ember','breach')+cell(9,'of 11',82,'2 staff','pine')+'</tr>'
    +'<tr><td class="rc"><div class="rn">Sunshine</div><div class="rm">Toddler · holds 11</div></td>'+cell(7,'of 11',64,'2 staff','pine')+cell(8,'of 11',73,'2 staff','pine')+cell(8,'of 11',73,'2 staff','pine')+cell(8,'of 11',73,'2 staff','pine')+cell(8,'of 11',73,'2 staff','pine')+'</tr>'
    +'<tr><td class="rc"><div class="rn">Rainbow</div><div class="rm">Preschool · holds 20</div></td>'+cell(16,'of 20',80,'2 staff','pine')+cell(17,'of 20',85,'2 staff','pine')+cell(18,'of 20',90,'2 staff','pine')+cell(17,'of 20',85,'2 staff','pine')+cell(15,'of 20',75,'2 staff','pine')+'</tr>'
    +'<tr><td class="rc"><div class="rn">Caterpillar</div><div class="rm">Infant · holds 8</div></td>'+cell(6,'of 8',75,'2 staff','pine')+cell(7,'of 8',88,'tight','gold')+cell(6,'of 8',75,'2 staff','pine')+cell(7,'of 8',88,'tight','gold')+'<td class="cell closed"><div class="occ tab">—</div><div class="cap">closed</div></td></tr>'
    +'</tbody></table></div>'
    +'</div></div>';

  var S={overview:OVERVIEW,decision:DECISION,roster:ROSTER};
  Object.keys(S).forEach(function(k){document.getElementById('s-'+k).innerHTML=S[k];});
  var subEl=document.getElementById('subtabs'),ophEl=document.getElementById('oph');
  function render(key){
    subEl.innerHTML=subtabs[key].map(function(t){return '<span class="st'+(t[1]?' on':'')+'">'+t[0]+'</span>';}).join('');
    ophEl.innerHTML='<div class="ophe">This section</div><div class="ophm">'+oph[key].map(function(m){return '<div class="om"><p style="margin:0"><span class="ov '+m[2]+' tab">'+m[0]+'</span><span class="ol">'+m[1]+'</span></p>'+(m[3]?'<div class="ot '+m[4]+'">'+m[3]+'</div>':'<div class="ot" style="color:transparent">—</div>')+'</div>';}).join('')+'</div>';
    document.getElementById('sub').textContent=sub[key];
    document.getElementById('act').textContent=act[key];
    document.getElementById('canvas').classList.toggle('white',key==='decision');
  }
  document.querySelectorAll('.sw').forEach(function(b){
    b.addEventListener('click',function(){
      document.querySelectorAll('.sw').forEach(function(x){x.setAttribute('aria-selected',x.dataset.s===b.dataset.s?'true':'false');});
      document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('on');});
      document.getElementById('s-'+b.dataset.s).classList.add('on');
      render(b.dataset.s);
    });
  });
  render('overview');
})();
</script>
