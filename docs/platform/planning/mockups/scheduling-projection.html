<title>Scheduling — projection</title>
<style>
  :root{
    --pine:#00A283;--pine-hover:#009276;--forge:#273F52;--ink:#18273A;--slate:#4b5563;--muted:#59678b;
    --stone:#F4F6F9;--gold:#DBC078;--gold-dark:#d0ad50;--ember:#BC4300;--blue:#00458C;--page:#EEF2F8;--border:#e5e9ef;
    --font:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    --mid-45:rgba(39,63,82,.45);--mid-40:rgba(39,63,82,.40);--mid-35:rgba(39,63,82,.35);--mid-25:rgba(39,63,82,.25);--mid-70:rgba(39,63,82,.70);
    color-scheme:light;
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{background:var(--page);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;font-size:13px;line-height:1.45}
  .tab{font-variant-numeric:tabular-nums} h1,h2,h3{margin:0} button{font-family:inherit;cursor:pointer;border:none;background:none}
  .frame{max-width:540px;margin:0 auto;padding:22px 18px 48px}
  .switch{display:flex;gap:6px;margin-bottom:14px;justify-content:center;flex-wrap:wrap}
  .sw{border:1px solid var(--mid-25);background:#fff;color:var(--slate);font-size:11.5px;font-weight:500;padding:6px 12px;border-radius:999px;transition:all .15s}
  .sw:hover{border-color:var(--pine);color:var(--pine)} .sw[aria-selected="true"]{border-color:var(--pine);background:rgba(0,162,131,.08);color:var(--pine);font-weight:600}
  .sw:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
  .fp{border-radius:14px;background:#fff;border:1px solid var(--mid-25);box-shadow:0 10px 34px rgba(39,63,82,.10);overflow:hidden}
  .fp-top{height:6px;background:var(--blue)}
  .fp-hd{display:flex;align-items:center;gap:10px;padding:11px 15px;border-bottom:1px solid var(--border)}
  .fp-av{width:32px;height:32px;border-radius:999px;display:grid;place-items:center;font-size:12px;font-weight:700;background:rgba(0,162,131,.10);color:var(--pine)} .fp-av.hh{background:rgba(0,69,140,.08);color:var(--blue)}
  .fp-nm{font-size:13.5px;font-weight:600;color:var(--forge)} .fp-sb{font-size:10.5px;color:var(--muted)}
  .fp-mis{margin-left:auto;font-size:10px;color:var(--muted);background:var(--stone);border:1px solid var(--border);padding:3px 9px;border-radius:999px}
  .fp-modes{display:flex;gap:4px;padding:7px 15px 0} .fpm{font-size:10.5px;font-weight:600;color:var(--mid-45);padding:4px 10px} .fpm.on{color:var(--pine);border-bottom:2px solid var(--pine)}
  .fp-body{padding:11px;display:flex;flex-direction:column;gap:9px;background:var(--stone)}
  .card{background:#fff;border:1px solid var(--border);border-left:3px solid var(--pine);border-radius:12px;overflow:hidden}
  .s-hd{display:flex;align-items:center;gap:8px;padding:10px 14px 6px} .s-q{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--slate)} .plat{margin-left:auto;font-size:9px;font-weight:600;color:var(--pine)}
  /* child block within household */
  .cblk{padding:9px 14px;border-top:1px solid #f1f3f6} .cblk:first-of-type{border-top:none}
  .cbhd{display:flex;align-items:center;gap:8px;margin-bottom:5px} .cbav{width:22px;height:22px;border-radius:999px;background:var(--stone);color:var(--forge);display:grid;place-items:center;font-size:9px;font-weight:600} .cbnm{font-size:13px;font-weight:600;color:var(--forge)} .cbstat{margin-left:auto;font-size:10px;font-weight:600} .cbstat.need{color:var(--gold-dark)}
  .cbhist{margin-left:auto;font-size:10.5px;font-weight:600;color:var(--pine)}
  /* schedule view row */
  .sv{display:flex;align-items:flex-start;gap:10px;padding:5px 0}
  .svtag{flex:0 0 62px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 0;margin-top:2px}
  .svtag.cur{color:var(--pine)} .svtag.up{color:var(--blue)} .svtag.tmp{color:var(--gold-dark)} .svtag.end{color:var(--muted)}
  .svmain{min-width:0;flex:1} .svline{font-size:12.5px;font-weight:600;color:var(--forge)} .svmeta{font-size:11px;color:var(--muted);margin-top:1px} .svrate{font-size:11px;color:var(--slate);margin-top:1px} .svrate b{color:var(--forge)}
  .svsub{font-size:11px;color:var(--gold-dark);margin-top:1px}
  .asg{font-size:11.5px;color:var(--forge);padding:1px 0;display:flex;gap:8px} .asg .ad{flex:0 0 84px;font-weight:600} .asg .ar{color:var(--slate)}
  .placebtn{font-size:11px;font-weight:600;color:var(--pine)}
  .s-ft{padding:9px 14px 11px;display:flex;gap:8px;flex-wrap:wrap} .bs{display:inline-flex;align-items:center;gap:6px;border-radius:7px;border:1px solid var(--mid-25);background:#fff;padding:6px 11px;font-size:11.5px;font-weight:500;color:var(--mid-70)}
  .mc{background:#fff;border:1px solid var(--border);border-left:3px solid var(--gold-dark);border-radius:10px;padding:8px 13px} .mc-q{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mid-40)} .mc-v{font-size:12px;font-weight:600;color:var(--forge);margin-top:1px} .mc-s{font-size:11px;color:var(--slate)}
  /* command surface */
  .cmd{background:#fff;border:1px solid var(--mid-25);border-radius:12px;box-shadow:0 8px 26px rgba(39,63,82,.12);overflow:hidden}
  .cmd-hd{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border)} .cmd-t{font-size:13px;font-weight:600;color:var(--forge)} .cmd-x{margin-left:auto;color:var(--mid-40)}
  .cmd-step{padding:11px 14px;border-bottom:1px solid #f1f3f6} .cmd-l{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mid-40);margin-bottom:7px}
  .days{display:flex;gap:6px} .day{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--muted);background:var(--stone);border:1px solid var(--border)} .day.on{background:rgba(0,162,131,.10);color:var(--pine);border-color:rgba(0,162,131,.35)} .day.off{opacity:.55}
  .hours{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--forge);font-weight:600} .roompill{font-size:11.5px;color:var(--slate);background:var(--stone);border:1px solid var(--border);border-radius:8px;padding:5px 10px}
  .ovr{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--forge);background:var(--stone);border:1px solid var(--border);border-radius:8px;padding:7px 10px} .ovr .od{font-weight:600} .ovr .ot{color:var(--slate)} .ovr .ox{margin-left:auto;color:var(--mid-40);font-size:11px}
  .addovr{font-size:11.5px;font-weight:600;color:var(--pine);margin-top:8px;display:inline-block}
  .effrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--forge)} .field{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--mid-25);border-radius:8px;padding:6px 10px} .field .fx{color:var(--mid-40);font-size:11px} .chk{font-size:12px;color:var(--slate);display:inline-flex;align-items:center;gap:6px} .box{width:14px;height:14px;border-radius:4px;border:2px solid var(--mid-25)}
  .cmd-ft{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--stone)} .cmd-note{font-size:10.5px;color:var(--muted)} .bp{display:inline-flex;align-items:center;gap:6px;border-radius:7px;background:var(--pine);padding:7px 13px;font-size:12px;font-weight:600;color:#fff;margin-left:auto}
  .screen{display:none}.screen.on{display:block} .lab{font-size:11px;color:var(--muted);text-align:center;margin-top:8px}
</style>

<div class="frame">
  <div class="switch" role="tablist" aria-label="Screens">
    <button class="sw" role="tab" aria-selected="true" data-s="household">Household</button>
    <button class="sw" role="tab" aria-selected="false" data-s="child">Child</button>
    <button class="sw" role="tab" aria-selected="false" data-s="split">Split week</button>
    <button class="sw" role="tab" aria-selected="false" data-s="rates">Rates</button>
    <button class="sw" role="tab" aria-selected="false" data-s="pattern">Pattern editor</button>
  </div>
  <div id="stage"></div>
</div>

<script>
(function(){
  function panel(av,avcls,nm,sub,mis,body){return '<div class="fp"><div class="fp-top"></div><div class="fp-hd"><div class="fp-av '+avcls+'">'+av+'</div><div><div class="fp-nm">'+nm+'</div><div class="fp-sb">'+sub+'</div></div><div class="fp-mis">'+mis+'</div></div><div class="fp-modes"><span class="fpm on">Work</span><span class="fpm">Activity</span></div><div class="fp-body">'+body+'</div></div>';}
  function sv(tag,tagcls,line,meta,rate,sub){return '<div class="sv"><span class="svtag '+tagcls+'">'+tag+'</span><div class="svmain"><div class="svline">'+line+'</div><div class="svmeta">'+meta+'</div>'+(rate?'<div class="svrate">'+rate+'</div>':'')+(sub?'<div class="svsub">'+sub+'</div>':'')+'</div></div>';}

  var HOUSEHOLD=panel('R','hh','Rivera household','Maple Street · 3 children','Household',
    '<div class="card"><div class="s-hd"><span class="s-q">Schedule · household</span><span class="plat">Platform</span></div>'
    +'<div class="cblk"><div class="cbhd"><span class="cbav">ER</span><span class="cbnm">Ethan</span><span class="cbhist">History →</span></div>'
    +sv('Current','cur','Sunshine · Mon–Fri · 8:30–5:30','Starts Jul 28 · open-ended','<b>$980</b>/month')
    +sv('Upcoming','up','Rainbow · Mon–Thu','Begins Sep 2','<b>$1,040</b>/month')+'</div>'
    +'<div class="cblk"><div class="cbhd"><span class="cbav">AV</span><span class="cbnm">Ava</span><span class="cbhist">History →</span></div>'
    +sv('Current','cur','Rainbow · Tue/Thu','Open-ended','<b>$460</b>/month')+'</div>'
    +'<div class="cblk"><div class="cbhd"><span class="cbav">MI</span><span class="cbnm">Mia</span><span class="cbstat need">Needs placement</span></div>'
    +sv('','end','Starts Aug 12 · no valid room','Every eligible room is full on her days','','<span class="placebtn">Place Mia →</span>')+'</div>'
    +'</div>')
    +'<div class="lab">Same card, household subject: it answers "how is this family scheduled?" — each child\'s own schedules, never flattened.</div>';

  var CHILD=panel('ER','','Ethan Rivera','Toddler · Maple Street','Review schedule',
    '<div class="card"><div class="s-hd"><span class="s-q">Schedule</span><span class="plat">Scheduled</span></div>'
    +'<div class="cblk" style="border-top:none"><span class="svtag cur" style="flex:none">Current</span>'
    +sv('','cur','Sunshine · Mon–Fri · 8:30–5:30','Starts Jul 28 · open-ended','<b>$980</b>/month')+'</div>'
    +'<div class="cblk"><span class="svtag tmp" style="flex:none">Temporary</span>'
    +sv('','tmp','Rainbow · Thursdays only','Jul 24 – Aug 15 · returns to Sunshine','')+'</div>'
    +'<div class="cblk"><span class="svtag up" style="flex:none">Upcoming</span>'
    +sv('','up','Rainbow · Mon–Fri (fall)','Begins Sep 2 · open-ended','<b>$1,040</b>/month')+'</div>'
    +'<div class="cblk"><span class="svtag end" style="flex:none">History</span>'
    +sv('','end','Sunflower · Mon–Fri','Ended Jun 30','')+'</div>'
    +'<div class="s-ft"><button class="bs">Change schedule</button><button class="bs">Add future schedule</button><button class="bs">Temporary move</button></div>'
    +'</div>')
    +'<div class="lab">Same card, child subject: the full lifecycle — Current · Temporary · Upcoming · History.</div>';

  var SPLIT=panel('ER','','Ethan Rivera','Toddler · Maple Street','Review schedule',
    '<div class="card"><div class="s-hd"><span class="s-q">Schedule</span><span class="plat">Scheduled</span></div>'
    +'<div class="cblk" style="border-top:none"><span class="svtag cur" style="flex:none">Current</span>'
    +'<div class="svmeta" style="margin:2px 0 5px">Starts Jul 28 · open-ended · <b style="color:var(--forge)">$980</b>/month</div>'
    +'<div class="asg"><span class="ad">Mon Wed Fri</span><span class="ar">Sunshine · 8:30–5:30</span></div>'
    +'<div class="asg"><span class="ad">Tue Thu</span><span class="ar">Rainbow · 9:30–5:30</span></div>'
    +'</div>'
    +'<div class="s-ft"><button class="bs">Change schedule</button></div>'
    +'</div>')
    +'<div class="lab">Different rooms and times by weekday are two assignments in one schedule — not two schedules.</div>';

  var RATES=panel('ER','','Ethan Rivera','Toddler · Maple Street','Review schedule',
    '<div class="card"><div class="s-hd"><span class="s-q">Schedule &amp; rate</span><span class="plat">Scheduled</span></div>'
    +'<div class="cblk" style="border-top:none">'
    +sv('Current','cur','Sunshine · Mon–Fri','Open-ended','<b>$980</b>/month · projected')
    +sv('Upcoming','up','Rainbow · Mon–Fri','Begins Sep 2','<b>$1,040</b>/month beginning Sep 2','Subsidy applies · funded amount owned by Billing')
    +'</div>'
    +'<div class="s-ft"><button class="bs">Change schedule</button></div></div>'
    +'<div class="mc"><div class="mc-q">Billing</div><div class="mc-v">Invoices &amp; balance</div><div class="mc-s">the ledger is owned by Billing, not Scheduling</div></div>')
    +'<div class="lab">Projected tuition follows the schedule. Rate changes appear as upcoming; Billing owns the ledger.</div>';

  var PATTERN=panel('ER','','Ethan Rivera','Toddler · Maple Street','Change schedule',
    '<div class="card" style="opacity:.5"><div class="s-hd"><span class="s-q">Schedule</span></div><div class="cblk" style="border-top:none;padding-top:4px"><div class="svline">Sunshine · Mon–Fri</div></div></div>'
    +'<div class="cmd"><div class="cmd-hd"><span class="cmd-t">Schedule · Ethan</span><span class="cmd-x">✕</span></div>'
    +'<div class="cmd-step"><div class="cmd-l">Days</div><div class="days"><span class="day on">M</span><span class="day on">T</span><span class="day on">W</span><span class="day on">T</span><span class="day on">F</span><span class="day off">S</span><span class="day off">S</span></div></div>'
    +'<div class="cmd-step"><div class="cmd-l">Default hours &amp; room</div><div class="hours">8:30 <span style="color:var(--mid-40)">–</span> 5:30 <span class="roompill">Room Sunshine</span></div></div>'
    +'<div class="cmd-step"><div class="cmd-l">Assignments (optional overrides)</div><div class="ovr"><span class="od">Tue &amp; Thu</span><span class="ot">Rainbow · 9:30–5:30</span><span class="ox">✕</span></div><span class="addovr">+ Add an override</span></div>'
    +'<div class="cmd-step"><div class="cmd-l">Effective</div><div class="effrow"><span>from</span><span class="field">Jul 28<span class="fx">▾</span></span><span class="chk"><span class="box"></span> temporary (set end date)</span></div></div>'
    +'<div class="cmd-ft"><span class="cmd-note">A focused command — the card stays read-first.</span><button class="bp">Commit schedule</button></div></div>')
    +'<div class="lab">The pattern editor lives in the Command Surface, editing assignments. It appears only when intentionally editing.</div>';

  var S={household:HOUSEHOLD,child:CHILD,split:SPLIT,rates:RATES,pattern:PATTERN};
  var stage=document.getElementById('stage');
  document.querySelectorAll('.sw').forEach(function(b){b.addEventListener('click',function(){
    document.querySelectorAll('.sw').forEach(function(x){x.setAttribute('aria-selected',x.dataset.s===b.dataset.s?'true':'false');});
    stage.innerHTML=S[b.dataset.s];
  });});
  stage.innerHTML=S.household;
})();
</script>
