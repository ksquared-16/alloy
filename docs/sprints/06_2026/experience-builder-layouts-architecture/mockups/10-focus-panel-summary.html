<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>10 — Focus Panel Summary</title>
  <link rel="stylesheet" href="_shared.css" />
</head>
<body>
<div class="frame">
  <div class="label">Focus Panel · Summary <span>card grid editor</span></div>
  <div class="body">
    <div class="bos"><div class="bos-i on">▦</div></div>
    <div class="config-page">
      <div class="shell">
        <aside class="queue-col narrow"><div class="q-item on"><div class="t">Summary cards</div></div></aside>
        <div class="workspace">
          <div class="ws-toolbar"><h2>Summary mode</h2><button class="btn-pine">+ Add card</button></div>
          <div class="ws-body">
            <div class="fp-chrome">
              <div style="font-weight:600">Sarah Chen · New inquiry</div>
              <div class="fp-modes"><span class="fp-mode on">Summary</span><span class="fp-mode">Work</span><span class="fp-mode">Activity</span></div>
            </div>
            <div class="card-grid" style="margin-top:12px">
              <div class="card span-3"><div class="card-h"><div class="ico">!</div><div class="title">Attention</div></div><div class="field-row"><span class="lbl">Item</span><span class="val">Follow up tour</span></div></div>
              <div class="card span-3"><div class="card-h"><div class="ico">◉</div><div class="title">Current Work</div></div><div class="field-row"><span class="lbl">Step</span><span class="val">Schedule tour</span></div></div>
              <div class="card span-3"><div class="card-h"><div class="ico">✓</div><div class="title">Readiness</div></div><div class="field-row"><span class="lbl">Score</span><span class="val">72%</span></div></div>
              <div class="card span-3"><div class="card-h"><div class="ico">📅</div><div class="title">Tour</div></div></div>
              <div class="card span-6"><div class="card-h"><div class="ico">⌁</div><div class="title">Household</div></div></div>
              <div class="card span-6"><div class="card-h"><div class="ico">👶</div><div class="title">Children</div></div></div>
              <div class="card span-12"><div class="card-h"><div class="ico">✉</div><div class="title">Communications</div></div></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
