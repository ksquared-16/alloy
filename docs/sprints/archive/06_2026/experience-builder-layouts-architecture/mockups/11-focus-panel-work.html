<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>11 — Focus Panel Work</title>
  <link rel="stylesheet" href="_shared.css" />
</head>
<body>
<div class="frame">
  <div class="label">Focus Panel · Work <span>action & workflow cards</span></div>
  <div class="body">
    <div class="bos"><div class="bos-i on">▦</div></div>
    <div class="config-page">
      <div class="shell">
        <div class="workspace">
          <div class="ws-toolbar"><h2>Work mode</h2><button class="btn-pine">+ Add card</button></div>
          <div class="ws-body">
            <div class="fp-chrome">
              <div style="font-weight:600">Sarah Chen</div>
              <div class="fp-modes"><span class="fp-mode">Summary</span><span class="fp-mode on">Work</span><span class="fp-mode">Activity</span></div>
            </div>
            <div class="card-grid" style="margin-top:12px">
              <div class="card span-12"><div class="card-h"><div class="ico">🚀</div><div class="title">Work launcher</div><div class="sub">Quick actions row</div></div></div>
              <div class="card span-8"><div class="card-h"><div class="ico">⎇</div><div class="title">Workflow steps</div></div><div class="field-row"><span class="lbl">Active</span><span class="val">Schedule tour</span></div></div>
              <div class="card span-4"><div class="card-h"><div class="ico">☑</div><div class="title">Tasks</div></div></div>
              <div class="card span-6"><div class="card-h"><div class="ico">⚡</div><div class="title">Automations</div></div></div>
              <div class="card span-6"><div class="card-h"><div class="ico">📝</div><div class="title">Notes</div></div></div>
            </div>
            <p class="hint">Work catalog differs from Summary — workflow-oriented blueprints.</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
